{% load static %}<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block titulo %}Área interna{% endblock %} - Superação da Violência Doméstica</title>
    <link rel="stylesheet" href="{% static 'front/fontes.css' %}">
    <link rel="stylesheet" href="{% static 'front/interno.css' %}">
</head>
<body>
    <header class="topo-interno">
        <a href="{% url 'assistidas_lista' %}"><img src="{% static 'front/logotipo-cor.svg' %}" alt="Superação da Violência Doméstica" width="200" height="50"></a>
        <nav>
            <a href="{% url 'assistidas_lista' %}">Assistidas</a>
            {% if request.user.is_staff %}<a href="{% url 'admin:index' %}">Administração</a>{% endif %}
            <form class="sair" method="post" action="{% url 'sair' %}">
                {% csrf_token %}
                <button type="submit">Sair ({{ request.user.get_username }})</button>
            </form>
        </nav>
    </header>
    <main class="conteudo-interno">
        {% block conteudo %}{% endblock %}
        <p class="aviso">Informações confidenciais. Acesso restrito à equipe autorizada.</p>
    </main>
</body>
</html>
